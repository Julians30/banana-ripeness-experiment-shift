name: repository-audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Show audit context
        run: |
          python --version
          git rev-parse --short HEAD
          find archive notebooks config results docs scripts -maxdepth 3 -type f | sort

      - name: Run read-only repository integrity audit
        run: python scripts/audit_repository.py
