name: repository-audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Show audit context
        run: |
          python --version
          git rev-parse --short HEAD
          find notebooks notebooks_packed config results/main_tables scripts -maxdepth 2 -type f | sort

      - name: Run repository integrity audit
        run: python scripts/audit_repository.py
